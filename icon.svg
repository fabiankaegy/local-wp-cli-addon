<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="5" y="5" width="90" height="90" rx="15" ry="15" fill="url(#termGrad)"/>
  <!-- Terminal window frame -->
  <rect x="15" y="20" width="70" height="60" rx="5" ry="5" fill="#1e1e1e"/>
  <!-- Terminal header bar -->
  <rect x="15" y="20" width="70" height="12" rx="5" ry="5" fill="#323232"/>
  <rect x="15" y="27" width="70" height="5" fill="#323232"/>
  <!-- Window buttons -->
  <circle cx="24" cy="26" r="3" fill="#ff5f56"/>
  <circle cx="34" cy="26" r="3" fill="#ffbd2e"/>
  <circle cx="44" cy="26" r="3" fill="#27ca40"/>
  <!-- Terminal prompt lines -->
  <text x="22" y="48" font-family="monospace" font-size="10" fill="#4ec9b0">$</text>
  <text x="32" y="48" font-family="monospace" font-size="10" fill="#9cdcfe">php -v</text>
  <text x="22" y="60" font-family="monospace" font-size="10" fill="#4ec9b0">$</text>
  <text x="32" y="60" font-family="monospace" font-size="10" fill="#9cdcfe">wp cli</text>
  <text x="22" y="72" font-family="monospace" font-size="10" fill="#4ec9b0">$</text>
  <rect x="32" y="66" width="8" height="10" fill="#4ec9b0" opacity="0.7"/>
</svg>
