name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --production --legacy-peer-deps

      - name: Create release zip
        run: |
          mkdir -p dist/local-addon-vscode-terminal
          cp -r lib node_modules package.json icon.svg README.md dist/local-addon-vscode-terminal/
          cd dist
          zip -r ../local-addon-vscode-terminal.zip local-addon-vscode-terminal

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: local-addon-vscode-terminal.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
